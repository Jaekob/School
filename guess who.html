#hdr{display:flex;align-items:center;gap:10px;width:100%;max-width:80rem;margin:0 auto;padding:12px 12px 0}
@media(min-width:768px){#hdr{padding:16px 24px 0}}
#hdr h1{font-size:20px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:768px){#hdr h1{font-size:24px}}
#hdr h1 .jp{font-size:14px;color:var(--st400);font-weight:700;margin-left:6px}
@media(min-width:768px){#hdr h1 .jp{font-size:16px}}
.hdr-sp{flex:1}
.iconbtn{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:16px;background:#fff;color:var(--st600);box-shadow:0 4px 0 rgba(0,0,0,.08);border-bottom:4px solid var(--st300);text-decoration:none}
.iconbtn:hover{background:var(--st50)}
.iconbtn.active{background:var(--am400);border-color:var(--am500);color:#451a03}
.iconbtn svg{width:20px;height:20px}

/* ---------------- main / footer ---------------- */
main{flex:1;width:100%;max-width:80rem;margin:0 auto;padding:16px 12px}
@media(min-width:768px){main{padding:24px}}
footer{margin-top:auto;border-top:2px solid rgba(255,237,213,.8);background:rgba(255,255,255,.6);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
footer p{text-align:center;font-size:12px;font-weight:700;color:var(--st400)}
@media(min-width:768px){footer p{font-size:14px}}

/* ---------------- panels & pills ---------------- */
.panel{background:rgba(255,255,255,.85);border:4px solid #fff;border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.06)}
.panel.solid{background:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
@media(min-width:768px){.pill{font-size:16px}}
.p-white{background:#fff;color:var(--st700);box-shadow:0 3px 0 rgba(0,0,0,.06)}
.p-amber{background:var(--am100);color:var(--am800)}
.p-soft{background:rgba(255,255,255,.7);box-shadow:0 3px 0 rgba(0,0,0,.05)}
.p-totals{background:#fff;color:var(--st500);box-shadow:0 3px 0 rgba(0,0,0,.06)}
.p-totals .fewest{font-size:12px;color:var(--st300)}

/* ---------------- chunky buttons ---------------- */
.chunky{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;border-bottom:4px solid;font-weight:700;letter-spacing:.02em;user-select:none;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:background .15s,transform .05s,box-shadow .05s;text-decoration:none;text-align:center}
.chunky:active{transform:translateY(4px);box-shadow:none}
.chunky:disabled{opacity:.45;cursor:not-allowed}
.chunky.sm{min-height:36px;padding:4px 12px;font-size:14px}
.chunky.md{min-height:44px;padding:8px 20px;font-size:16px}
.chunky.lg{min-height:56px;padding:12px 28px;font-size:20px}
.v-primary{background:var(--or500);color:#fff;border-color:var(--or700)}.v-primary:hover{background:var(--or600)}
.v-green{background:var(--em500);color:#fff;border-color:var(--em700)}.v-green:hover{background:var(--em600)}
.v-pink{background:var(--pk500);color:#fff;border-color:var(--pk700)}.v-pink:hover{background:var(--pk600)}
.v-purple{background:var(--pu500);color:#fff;border-color:var(--pu700)}.v-purple:hover{background:var(--pu600)}
.v-red{background:var(--rd500);color:#fff;border-color:var(--rd700)}.v-red:hover{background:var(--rd600)}
.v-neutral{background:#fff;color:var(--st800);border-color:var(--st300);box-shadow:0 6px 0 rgba(0,0,0,.1)}.v-neutral:hover{background:var(--st50)}
.v-ghost{background:transparent;color:var(--st600);border-color:transparent;box-shadow:none}.v-ghost:hover{background:rgba(28,25,23,.05)}

/* ---------------- board & character cards ---------------- */
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.board{grid-template-columns:repeat(4,1fr)}}
@media(min-width:768px){.board{grid-template-columns:repeat(5,1fr);gap:12px}}
.card{position:relative;display:flex;flex-direction:column;align-items:center;background:#fff;border:4px solid #e5e5e5;border-radius:16px;padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.07);transition:transform .15s,box-shadow .15s,opacity .2s,filter .2s;user-select:none;font:inherit}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(0,0,0,.10)}
.card.click:active{transform:translateY(0)}
.card:focus-visible{outline:4px solid var(--am300);outline-offset:2px}
.card.elim{opacity:.55;filter:saturate(.15)}
.card.wrong{box-shadow:0 5px 0 rgba(0,0,0,.07),0 0 0 4px var(--rd400)}
.card.flash{animation:shake .5s ease-in-out}
.cbadge{position:absolute;z-index:5;top:2px;left:2px}
@media(min-width:768px){.cbadge{top:4px;left:4px}}
.cwrong{position:absolute;z-index:5;top:2px;right:4px;font-size:20px}
@media(min-width:768px){.cwrong{font-size:24px}}
.cimg{position:relative;display:block;width:100%;height:96px;border-radius:12px;overflow:hidden;background:var(--imgbg)}
.cimg img{width:100%;height:100%;object-fit:contain;user-select:none}
@media(min-width:768px){.cimg{height:112px}}
@media(min-width:1280px){.cimg{height:128px}}
.cimg.big{width:min(224px,64vw);height:min(224px,64vw);border-radius:16px}
@media(min-width:768px){.cimg.big{width:288px;height:288px}}
.cname{margin-top:4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:14px;line-height:1.25}
@media(min-width:768px){.cname{font-size:16px}}
.cname.big{margin-top:8px;font-size:36px;white-space:normal;text-align:center;line-height:1.1}
@media(min-width:768px){.cname.big{font-size:48px}}
.celim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cx{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:rgba(239,68,68,.9);color:#fff;font-weight:900;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.cx.big{width:112px;height:112px;font-size:70px}

/* ---------------- gender badge (bathroom-sign style) ---------------- */
.gbadge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid;background:rgba(255,255,255,.95);box-shadow:0 2px 4px rgba(0,0,0,.15);flex:none}
.gbadge.md{width:28px;height:28px}
@media(min-width:768px){.gbadge.md{width:32px;height:32px}}
.gbadge.md svg{width:18px;height:18px}
@media(min-width:768px){.gbadge.md svg{width:20px;height:20px}}
.gbadge.lg{width:48px;height:48px}
.gbadge.lg svg{width:28px;height:28px}
.gbadge.boy{border-color:var(--te500)}.gbadge.boy svg{color:var(--te600)}
.gbadge.girl{border-color:var(--pk400)}.gbadge.girl svg{color:var(--pk500)}
.gbadge.unknown{border-color:var(--am400)}
.gbadge.unknown .gq{font-size:14px;font-weight:900;color:var(--am500)}
.gbadge.lg .gq{font-size:22px}

/* ---------------- tag chips (clue icons) ---------------- */
.chiprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-weight:700}
.chip.md{padding:2px 4px;font-size:13px}
.chip.md .ci{font-size:15px}
.chip.md.showlabel{padding:2px 8px}
.chip.lg{padding:4px 10px;font-size:16px}
.chip.lg .ci{font-size:20px}
@media(min-width:768px){.chip.lg{font-size:18px}}
.chip.c-can{background:var(--em100);color:var(--em800)}
.chip.c-goodAt{background:var(--am100);color:var(--am800)}
.chip.c-is{background:var(--pk100);color:var(--pk800)}
.qc-can{background:var(--em500);color:#fff}
.qc-goodAt{background:var(--am500);color:#fff}
.qc-is{background:var(--pk500);color:#fff}
.chiprow.big{margin-top:12px;max-width:28rem;gap:6px}

/* ---------------- question starters ---------------- */
.starters{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.starters .ask{font-size:14px;font-weight:800;color:var(--st400)}
@media(min-width:768px){.starters .ask{font-size:16px}}
.starters .q{border-radius:999px;padding:4px 12px;font-size:14px;font-weight:800}
@media(min-width:768px){.starters .q{font-size:16px}}

/* ---------------- play screen ---------------- */
.playwrap{display:flex;flex-direction:column;gap:10px}
.playbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.playbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.peekbtn{min-height:36px;user-select:none;border-radius:16px;border-bottom:4px solid var(--st300);background:#fff;padding:4px 12px;font-size:14px;font-weight:700;color:var(--st600);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.peekbtn:hover{background:var(--st50)}
.peekbtn:active{transform:translateY(3px);box-shadow:none}
.actionbar{position:sticky;bottom:8px;z-index:30;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;border:4px solid #fff;border-radius:24px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
@media(min-width:768px){.actionbar{bottom:12px}}
.ptsbubble{background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;margin-left:2px}
.keys-hint{font-size:12px;font-weight:700;color:var(--st300)}
@media(max-width:1023px){.keys-hint{display:none}}
.board.pad-bottom{padding-bottom:112px}
@media(min-width:768px){.board.pad-bottom{padding-bottom:12px}}

/* peek overlay */
.peek{position:fixed;right:16px;bottom:96px;z-index:55;transform:rotate(2deg)}
@media(min-width:768px){.peek{bottom:112px}}
.peekbox{background:#fff;border:4px solid var(--am300);border-radius:16px;padding:8px;box-shadow:0 25px 50px rgba(0,0,0,.25)}
.peeklabel{display:block;text-align:center;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--am500);margin-bottom:4px}

/* ---------------- overlays / modals ---------------- */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(28,25,23,.6);padding:12px;animation:fadein .2s both}
.modal{max-height:88vh;overflow-y:auto;width:100%;background:#fff;border:4px solid #fff;border-radius:24px;padding:20px;box-shadow:0 25px 50px rgba(0,0,0,.3)}
.modal.guide{max-width:48rem}
.modal.guess{max-width:42rem}
.modal h2{text-align:center;font-size:28px;font-weight:800;color:var(--pu600)}
@media(min-width:768px){.modal h2{font-size:36px}}
.modal h2 .jp{font-size:18px;color:var(--st400)}
.modal .sub{margin-top:4px;text-align:center;font-size:15px;font-weight:700;color:var(--st500)}
.modal .sub .warn{margin-left:8px;border-radius:999px;background:var(--rd100);padding:2px 8px;font-size:13px;font-weight:800;color:var(--rd600)}
.modal-foot{margin-top:16px;text-align:center}
.guessgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
@media(min-width:640px){.guessgrid{grid-template-columns:repeat(4,1fr)}}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--st200);background:#fff;border-radius:16px;padding:8px;transition:all .15s}
.gbtn:hover{transform:translateY(-2px);border-color:var(--pu400);background:var(--pu50)}
.gbtn:focus-visible{outline:4px solid var(--am300);outline-offset:1px}
.gimg{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--imgbg)}
@media(min-width:768px){.gimg{width:64px;height:64px}}
.gimg img{width:100%;height:100%;object-fit:cover}
.gname{font-weight:800;font-size:14px}
@media(min-width:768px){.gname{font-size:16px}}
.guide-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.guide-head h2{text-align:left;color:var(--st800)}
.guide-head h2 .jp{font-size:15px;color:var(--st400)}
.guide-cat{background:var(--st50);border-radius:16px;padding:12px}
.guide-cat + .guide-cat{margin-top:16px}
.guide-pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800;margin-bottom:8px}
.guide-grid{display:flex;flex-wrap:wrap;gap:6px}
.guide-tip{margin-top:16px;text-align:center;font-size:13px;font-weight:700;color:var(--st400)}

/* ---------------- big centered screens ---------------- */
.center-col{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.hd-emoji{font-size:112px;line-height:1}
@media(min-width:768px){.hd-emoji{font-size:160px}}
.hd-title{font-size:56px;font-weight:800;letter-spacing:-.02em;color:var(--pu600);line-height:1.05}
@media(min-width:768px){.hd-title{font-size:80px}}
.hd-title.green{color:var(--em600)}
.hd-sub{font-size:28px;font-weight:800;color:var(--st700)}
@media(min-width:768px){.hd-sub{font-size:32px}}
.hd-jp{font-size:19px;font-weight:700;color:var(--st400)}
@media(min-width:768px){.hd-jp{font-size:22px}}
.teacher-note{font-size:14px;font-weight:700;color:var(--st400)}
.btn-stack{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.result-pill{border-radius:16px;background:var(--am100);padding:8px 20px;font-size:24px;font-weight:800;color:var(--am800)}
.result-pill .small{margin-left:8px;font-size:15px;font-weight:700;color:var(--am600)}
.pending-note{border-radius:24px;background:var(--st100);padding:12px 24px;font-size:20px;font-weight:800;color:var(--st600)}
.no-rounds{border:4px solid #fff;background:#fff;border-radius:24px;padding:24px;font-size:20px;font-weight:700;color:var(--st500);box-shadow:0 8px 0 rgba(0,0,0,.06)}
.winner{border-radius:24px;padding:16px 32px;font-size:36px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.08)}
@media(min-width:768px){.winner{font-size:44px}}
.winner.red{background:var(--rd500);color:#fff}
.winner.white{background:#fff;color:var(--st800);border:4px solid var(--st200)}
.winner.tie{background:var(--am100);color:var(--am700)}

/* ---------------- scoreboard table ---------------- */
.scoretable-wrap{width:100%;overflow:hidden;border:4px solid #fff;border-radius:24px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.06)}
table.score{width:100%;text-align:center;font-size:20px;font-weight:800}
table.score th{padding:8px 16px;font-size:16px;color:var(--st400);background:var(--st50)}
table.score td{padding:10px 16px}
table.score tbody tr{border-top:2px solid var(--st100)}
table.score .td-red{color:var(--rd500)}
table.score .td-left{text-align:left;color:var(--st500)}
table.score tr.total{border-top:4px solid var(--st200);background:var(--am50)}
table.score tr.total td{padding:12px 16px;font-size:24px}
@media(max-width:480px){table.score{font-size:17px}table.score th,table.score td{padding:8px 10px}}

/* ---------------- home ---------------- */
.home-col{display:flex;flex-direction:column;gap:24px}
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}
@media(min-width:768px){.hero{flex-direction:row;gap:32px;padding:32px}}
.hero-img{width:160px;height:160px;flex:none}
@media(min-width:768px){.hero-img{width:208px;height:208px}}
.hero-img img{width:100%;height:100%;object-fit:contain}
.hero-txt{text-align:center}
@media(min-width:768px){.hero-txt{text-align:left}}
.hero-txt h2{font-size:40px;font-weight:800;color:var(--or500);letter-spacing:-.01em;line-height:1.1}
@media(min-width:768px){.hero-txt h2{font-size:48px}}
.hero-txt .sub{font-size:22px;font-weight:700;color:var(--st500);margin-top:2px}
.hero-txt .meta{font-size:15px;font-weight:700;color:var(--st500);margin-top:8px}
.hero-txt .meta .dot{color:var(--st300)}
.pat-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
@media(min-width:768px){.pat-pills{justify-content:flex-start}}
.pat{border-radius:999px;padding:4px 16px;font-size:17px;font-weight:800}
.pat.can{background:var(--em100);color:var(--em700)}
.pat.goodAt{background:var(--am100);color:var(--am700)}
.pat.is{background:var(--pk100);color:var(--pk700)}
.modes{display:grid;gap:16px}
@media(min-width:768px){.modes{grid-template-columns:1fr 1fr}}
.modecard{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:4px solid #fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.06);transition:transform .15s}
.modecard:hover{transform:translateY(-4px)}
.modecard:focus-visible{outline:4px solid var(--am300);outline-offset:2px}
@media(min-width:768px){.modecard{align-items:flex-start;text-align:left}}
.mcicon{display:flex;width:64px;height:64px;align-items:center;justify-content:center;border-radius:16px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .15s}
.modecard:hover .mcicon{transform:scale(1.1)}
.mcicon svg{width:32px;height:32px}
.mcicon.bg-em{background:var(--em500)}
.mcicon.bg-pu{background:var(--pu500)}
.mctitle{font-size:24px;font-weight:800;color:var(--st800);margin-top:4px}
.mcjp{font-size:15px;font-weight:700;color:var(--st400)}
.mcdesc{font-size:14px;font-weight:700;color:var(--st500)}
.mcul{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.mcul li{display:flex;gap:6px;font-size:14px;font-weight:600;color:var(--st500);text-align:left}
.mcul .tri{font-size:12px;margin-top:3px;flex:none}
.mcstart{margin-top:16px;display:inline-block;border-radius:16px;padding:8px 24px;font-size:18px;font-weight:800;color:#fff;transition:transform .15s}
.modecard:hover .mcstart{transform:translateY(2px)}
.mcstart.bg-em{background:var(--em500);border-bottom:4px solid var(--em700)}
.mcstart.bg-pu{background:var(--pu500);border-bottom:4px solid var(--pu700)}
.golf-panel h3{text-align:center;font-size:20px;font-weight:800;color:var(--st700);margin-bottom:12px}
@media(min-width:768px){.golf-panel h3{font-size:24px}}
.golf-panel h3 .jp{font-size:13px;color:var(--st400);font-weight:700;margin-left:6px}
.golfg{display:grid;gap:12px}
@media(min-width:640px){.golfg{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.golfg{grid-template-columns:repeat(4,1fr)}}
.gstep{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--st50);border-radius:16px;padding:12px;text-align:center}
.gstep .ge{font-size:30px;line-height:1.2}
.gstep .gt{font-size:15px;font-weight:800;color:var(--st800)}
.gstep .gen{font-size:12px;font-weight:600;color:var(--st500)}
.gstep .gjp{font-size:12px;font-weight:700;color:var(--st400)}
.tips h3{font-size:18px;font-weight:800;color:var(--st600);margin-bottom:8px}
.tips ul{display:grid;gap:6px}
@media(min-width:768px){.tips ul{grid-template-columns:1fr 1fr}}

/* ---------------- setup steps ---------------- */
.setup-col{display:flex;flex-direction:column;gap:20px}
.setup-title{text-align:center;padding:20px}
.setup-title h2{font-size:36px;font-weight:800;color:var(--pu600)}
@media(min-width:768px){.setup-title h2{font-size:44px}}
.setup-title .sub{font-size:20px;font-weight:700;color:var(--st500);margin-top:4px}
.steps2{display:grid;gap:12px}
@media(min-width:640px){.steps2{grid-template-columns:1fr 1fr}}
.stepcard{display:flex;align-items:flex-start;gap:12px;background:#fff;border:4px solid #fff;border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.06)}
.stepcard .se{display:flex;width:48px;height:48px;flex:none;align-items:center;justify-content:center;border-radius:16px;background:var(--pu100);font-size:24px}
.stepcard .st1{font-size:18px;font-weight:800;color:var(--st800)}
.stepcard .st2{font-size:14px;font-weight:600;color:var(--st500)}
.stepcard .st3{font-size:12px;font-weight:700;color:var(--st400)}
.askfirst{text-align:center;padding:20px}
.askfirst p{font-size:24px;font-weight:800;color:var(--st700)}
.askfirst .row{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px}

/* ---------------- He / She warm-up ---------------- */
.hswrap{display:flex;flex-direction:column;gap:16px;max-width:64rem;margin:0 auto}
.hs-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.hs-stars{font-size:20px;font-weight:800;color:var(--am500)}
.listenbtn{margin-left:auto;min-height:44px;border-radius:999px;border-bottom:4px solid;padding:6px 16px;font-size:14px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.06);transition:background .15s}
.listenbtn.off{border-color:var(--st300);background:#fff;color:var(--st600)}
.listenbtn.off:hover{background:var(--st50)}
.listenbtn.on{border-color:var(--em700);background:var(--em500);color:#fff}
.hs-grid{display:grid;gap:16px;align-items:stretch}
@media(min-width:768px){.hs-grid{grid-template-columns:1fr 1fr}}
.piccard{position:relative;display:flex;min-height:256px;align-items:center;justify-content:center;background:#fff;border:4px solid #fff;border-radius:24px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.06)}
@media(min-width:768px){.piccard{min-height:320px}}
.picbadge{position:absolute;top:16px;left:16px}
.picinner{display:flex;flex-direction:column;align-items:center}
.solvedbanner{margin-bottom:8px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--st800);padding:6px 20px;font-size:22px;font-weight:800;color:#fff;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.picimg{width:min(224px,60vw);height:min(224px,60vw);object-fit:contain}
@media(min-width:768px){.picimg{width:288px;height:288px}}
.listenpanel{display:flex;width:min(224px,60vw);height:min(224px,60vw);flex-direction:column;align-items:center;justify-content:center;gap:8px;border:4px dashed var(--em300);border-radius:24px;background:var(--em50);text-align:center}
@media(min-width:768px){.listenpanel{width:288px;height:288px}}
.listenpanel .le{font-size:64px;line-height:1}
.listenpanel .lt{padding:0 16px;font-size:20px;font-weight:800;color:var(--em600)}
.sentencecard{display:flex;flex-direction:column;justify-content:space-between;gap:16px;background:rgba(255,255,255,.8);border:4px solid #fff;border-radius:24px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.06)}
.cat-pill{display:inline-block;border-radius:999px;padding:4px 16px;font-size:16px;font-weight:800}
.sentence{margin-top:12px;font-size:30px;font-weight:800;line-height:1.4;color:var(--st800)}
@media(min-width:768px){.sentence{font-size:36px}}
.blank{display:inline-block;min-width:96px;border-radius:12px;border-bottom:4px dashed var(--st400);background:var(--st100);padding:0 12px;text-align:center;color:var(--st400);margin:0 4px}
.head-he{color:var(--em600)}.head-she{color:var(--pk600)}
.together{margin-top:8px;font-size:20px;font-weight:700;color:var(--st500);animation:riseup .3s both}
.hsbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hsbtn{position:relative;min-height:96px;border-radius:24px;border-bottom:8px solid;font-size:48px;font-weight:800;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:background .15s;user-select:none}
@media(min-width:768px){.hsbtn{min-height:112px;font-size:60px}}
.hsbtn.he{background:var(--em500);border-color:var(--em700)}.hsbtn.he:hover:not(:disabled){background:var(--em600)}
.hsbtn.she{background:var(--pk500);border-color:var(--pk700)}.hsbtn.she:hover:not(:disabled){background:var(--pk600)}
.hsbtn:disabled{cursor:default}
.hsbtn.iswrong{opacity:.4;filter:saturate(.5)}
.hsbtn.isright{box-shadow:0 8px 0 rgba(0,0,0,.18),0 0 0 8px var(--am300)}
.hsbtn .mark{position:absolute;right:12px;top:8px;font-size:30px}
.nextrow{display:flex;justify-content:flex-end;animation:riseup .3s both}
.hs-tip{text-align:center;font-size:14px;font-weight:700;color:var(--st400)}
.finished-box{background:#fff;border:4px solid #fff;border-radius:24px;padding:32px 40px;box-shadow:0 10px 0 rgba(0,0,0,.06);animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.finished-box .big{font-size:44px;font-weight:800;color:var(--em500)}
.finished-box .jp{margin-top:8px;font-size:24px;font-weight:700;color:var(--st500)}
.starrow{margin-top:24px;display:flex;max-width:32rem;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.starrow span{font-size:30px}
.starrow span.dim{opacity:.15}
.finished-box .firsttry{margin-top:12px;font-size:20px;font-weight:700;color:var(--st600)}
.loading{display:flex;align-items:center;justify-content:center;padding:80px 0}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid var(--st200);border-top-color:var(--or500);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- fx canvas ---------------- */
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}

/* ---------------- animations ---------------- */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes riseup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes flipy{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.fade{animation:fadein .25s both}
.rise{animation:riseup .3s both}
.flip{animation:flipy .3s both}

/* ---------------- scrollbar ---------------- */
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:rgba(0,0,0,.04);border-radius:999px}
*::-webkit-scrollbar-thumb{background:#fdba74;border-radius:999px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#fb923c;border:3px solid transparent;background-clip:content-box}
</style>
</head>

var fxCanvas = null, fxParts = [], fxRunning = false;
var PARTY_COLORS = ['#F97316', '#22C55E', '#EC4899', '#A855F7', '#FACC15', '#14B8A6'];
function fxCtx() {
  if (!fxCanvas) fxCanvas = $('#fx');
  var c = fxCanvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = window.innerWidth, h = window.innerHeight;
  if (fxCanvas.width !== w * dpr || fxCanvas.height !== h * dpr) {
    fxCanvas.width = w * dpr; fxCanvas.height = h * dpr;
    fxCanvas.style.width = w + 'px'; fxCanvas.style.height = h + 'px';
  }
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return c;
}
function burst(n, ox, oy, spread, velocity, deg) {
  if (deg == null) deg = 90;
  for (var i = 0; i < n; i++) {
    /* canvas-confetti semantics: 90deg = straight up, <90 tilts right, >90 tilts left */
    var degJ = deg + (Math.random() - 0.5) * spread;
    var ang = -Math.PI / 2 + (90 - degJ) * Math.PI / 180;
    var v = velocity * (0.55 + Math.random() * 0.7);
    fxParts.push({
      x: ox * window.innerWidth, y: oy * window.innerHeight,
      vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
      rot: Math.random() * 360, vr: (Math.random() - 0.5) * 22,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      color: PARTY_COLORS[Math.floor(Math.random() * PARTY_COLORS.length)],
      life: 90 + Math.random() * 40
    });
  }
}
function celebrate(big) {
  try {
    if (big) {
      burst(160, 0.5, 0.6, 100, 13);
      setTimeout(function () { burst(90, 0, 0.7, 70, 11, 60); }, 180);
      setTimeout(function () { burst(90, 1, 0.7, 70, 11, 120); }, 320);
    } else {
      burst(40, 0.5, 0.7, 60, 9);
    }
  } catch (e) { /* decorative only */ }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxTick); }
}
function fxTick() {
  var c = fxCtx(), w = window.innerWidth, h = window.innerHeight;
  c.clearRect(0, 0, w, h);
  for (var i = fxParts.length - 1; i >= 0; i--) {
    var p = fxParts[i];
    p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if (p.life <= 0 || p.y > h + 40) { fxParts.splice(i, 1); continue; }
    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.rot * Math.PI / 180);
    c.globalAlpha = Math.min(1, p.life / 30);
    c.fillStyle = p.color;
    c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    c.restore();
  }
  if (fxParts.length > 0) { requestAnimationFrame(fxTick); }
  else { fxRunning = false; c.clearRect(0, 0, w, h); }
}

  var total = h.deck.length;
  if (h.finished) {
    var starsHtml = '';
    for (var i = 0; i < total; i++) {
      starsHtml += '<span' + (i < h.stars ? '' : ' class="dim"') + '>⭐</span>';
    }
    return '<div class="center-col" style="padding:40px 0">' +
      '<div class="finished-box" style="text-align:center">' +
        '<p class="big">Great job!</p>' +
        '<p class="jp">よくできました！</p>' +
        '<div class="starrow">' + starsHtml + '</div>' +
        '<p class="firsttry">First try: ' + h.stars + ' / ' + total + '</p>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px">' +
        chunky('primary', 'lg', 'heshe-again', '🔄 Play again') +
        chunky('neutral', 'lg', 'home', '🏠 Home') +
      '</div>' +
    '</div>';
  }
  var round = h.deck[h.idx];
  var c = round.char;
  var answer = c.gender === 'boy' ? 'He' : 'She';
  var sent = tagSentence(round.tag, c);
  var meta = CAT_META[TAGS[round.tag].cat];
  var isWrongHe = h.wrong.indexOf('He') !== -1;
  var isWrongShe = h.wrong.indexOf('She') !== -1;
  var picInner;
  if (h.listening && !h.solved) {
    picInner = '<div class="listenpanel"><span class="le" aria-hidden="true">👂</span><span class="lt">Listen! よく聞いてね</span></div>';
  } else {
    picInner = '<img class="picimg" src="' + imgOf(c) + '" alt="" draggable="false">';
  }
  var sentenceHtml = h.solved
    ? '<span class="' + (answer === 'He' ? 'head-he' : 'head-she') + '">' + sent.head + '</span>' + esc(sent.rest)
    : '<span class="blank">????</span>' + esc(sent.rest);
  return '<div class="hswrap">' +
    '<div class="hs-top">' +
      '<span class="pill p-white">' + (h.idx + 1) + ' / ' + total + '</span>' +
      '<span class="hs-stars">⭐ ' + h.stars + '</span>' +
      '<button type="button" class="listenbtn ' + (h.listening ? 'on' : 'off') + '" data-act="heshe-listen" aria-pressed="' + h.listening + '">' +
        (h.listening ? '👂 Listening mode: ON' : '🙈 Picture: visible') +
      '</button>' +
    '</div>' +
    '<div class="hs-grid">' +
      '<div class="piccard">' +
        '<span class="picbadge"><span class="' + (h.solved ? 'flip' : '') + '" style="display:inline-block">' + genderBadge(h.solved ? c.gender : null, 'lg') + '</span></span>' +
        '<div class="picinner fade">' +
          (h.solved ? '<span class="solvedbanner">This is ' + esc(c.name) + '!</span>' : '') +
          picInner +
          ((!h.listening || h.solved) ? tagRow(c, false, 'md', false).replace('chiprow', 'chiprow" style="margin-top:8px;max-width:18rem') : '') +
        '</div>' +
      '</div>' +
      '<div class="sentencecard">' +
        '<div>' +
          '<span class="cat-pill ' + meta.qchip + '">' + meta.label + '</span>' +
          '<p class="sentence rise">' + sentenceHtml + '</p>' +
          (h.solved ? '<p class="together">Say it together! みんなで言おう！</p>' : '') +
        '</div>' +
        '<div class="hsbtns">' +
          '<button type="button" class="hsbtn he' + (isWrongHe ? ' iswrong' : '') + (h.solved && answer === 'He' ? ' isright' : '') + '" data-act="heshe-answer" data-p="He" aria-label="Answer He"' + ((h.solved || isWrongHe) ? ' disabled' : '') + '>He' +
            (isWrongHe ? '<span class="mark">✗</span>' : '') + (h.solved && answer === 'He' ? '<span class="mark">✓</span>' : '') +
          '</button>' +
          '<button type="button" class="hsbtn she' + (isWrongShe ? ' iswrong' : '') + (h.solved && answer === 'She' ? ' isright' : '') + '" data-act="heshe-answer" data-p="She" aria-label="Answer She"' + ((h.solved || isWrongShe) ? ' disabled' : '') + '>She' +
            (isWrongShe ? '<span class="mark">✗</span>' : '') + (h.solved && answer === 'She' ? '<span class="mark">✓</span>' : '') +
          '</button>' +
        '</div>' +
        (h.solved ? '<div class="nextrow">' + chunky('green', 'lg', 'heshe-next', h.idx < total - 1 ? 'Next ▶' : 'Finish 🎉') + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<p class="hs-tip">Tip: press ← / → on the keyboard (or a clicker) to answer He / She!</p>' +
  '</div>';
}

function renderIconGuide() {
  var cats = [
    { cat: 'can', title: 'can 〜' },
    { cat: 'goodAt', title: 'is good at 〜' },
    { cat: 'is', title: 'is 〜' }
  ];
  var body = cats.map(function (x) {
    return '<div class="guide-cat">' +
      '<span class="guide-pill ' + CAT_META[x.cat].qchip + '">' + x.title + '</span>' +
      '<div class="guide-grid">' +
        ALL_TAG_IDS.filter(function (t) { return TAGS[t].cat === x.cat; })
          .map(function (t) { return tagChip(t, true, 'lg'); }).join('') +
      '</div>' +
    '</div>';
  }).join('');
  return '<div class="overlay" data-act="backdrop-guide"><div class="modal guide" role="dialog" aria-label="Icon guide">' +
    '<div class="guide-head">' +
      '<h2>📚 Icon Guide <span class="jp">アイコンの意味</span></h2>' +
      chunky('neutral', 'sm', 'close-guide', '✕ Close') +
    '</div>' +
    body +
    '<p class="guide-tip">Tip: hover (or long-press) any icon on the board to see its meaning.</p>' +
  '</div></div>';
}
function renderGuessModal(g) {
  var alive = CHARACTERS.filter(function (c) { return g.eliminated.indexOf(c.id) === -1; });
  return '<div class="overlay" data-act="backdrop-guess"><div class="modal guess" role="dialog" aria-label="Guess a name">' +
    '<h2>🎯 Say the name! <span class="jp">なまえを当てよう！</span></h2>' +
    '<p class="sub">' + TEAM_LABEL[g.asking] + ', shout your guess — then tap the name!' +
      '<span class="warn">Wrong guess = +1 point</span></p>' +
    '<div class="guessgrid">' +
      alive.map(function (c) {
        return '<button type="button" class="gbtn" data-act="guess-pick-name" data-id="' + c.id + '">' +
          '<span class="gimg"><img src="' + imgOf(c) + '" alt="" draggable="false"></span>' +
          '<span class="gname" style="color:' + c.accent + '">' + esc(c.name) + '</span>' +
          genderBadge(c.gender, 'md') +
        '</button>';
      }).join('') +
    '</div>' +
    '<div class="modal-foot">' + chunky('neutral', 'md', 'close-guess', '← Cancel') + '</div>' +
  '</div></div>';
}
function renderFinal(g) {
  var redPlayed = g.records.some(function (r) { return r.team === 'red'; });
  var whitePlayed = g.records.some(function (r) { return r.team === 'white'; });
  var totals = { red: 0, white: 0 };
  g.records.forEach(function (r) { totals[r.team] += r.points; });
  var winner = null;
  if (redPlayed && whitePlayed) {
    winner = totals.red === totals.white ? null : (totals.red < totals.white ? 'red' : 'white');
  }
  var byRound = {};
  g.records.forEach(function (r) {
    if (!byRound[r.round]) byRound[r.round] = {};
    byRound[r.round][r.team] = r.points;
  });
  var nums = Object.keys(byRound).map(Number).sort(function (a, b) { return a - b; });
  var rowsHtml = nums.map(function (n) {
    var row = byRound[n];
    return '<tr><td class="td-left">#' + n + '</td>' +
      '<td class="td-red">' + (row.red != null ? row.red : '—') + '</td>' +
      '<td>' + (row.white != null ? row.white : '—') + '</td></tr>';
  }).join('');
  var winnerHtml = '';
  if (g.records.length > 0 && redPlayed && whitePlayed) {
    if (winner === 'red') winnerHtml = '<p class="winner red pop">🏆 Red Team WINS!</p>';
    else if (winner === 'white') winnerHtml = '<p class="winner white pop">🏆 White Team WINS!</p>';
    else winnerHtml = '<p class="winner tie pop">🤝 It is a tie!</p>';
  } else if (g.records.length > 0) {
    var pending = redPlayed && !whitePlayed ? 'white' : 'red';
    winnerHtml = '<p class="pending-note">⏳ ' + TEAM_LABEL[pending] + ' has not played a round yet — keep going!</p>';
  }
  return '<div class="center-col" style="align-items:stretch;max-width:48rem;margin:0 auto">' +
    '<h2 style="text-align:center;font-size:36px;font-weight:800;color:var(--st800)">⛳ Final Score' +
      '<span style="margin-left:8px;font-size:20px;font-weight:700;color:var(--st400)">すくないほど勝ち！</span></h2>' +
    (g.records.length === 0
      ? '<p class="no-rounds" style="text-align:center">No finished rounds yet — go play! まだラウンドがないよ！</p>'
      : '<div class="scoretable-wrap"><table class="score">' +
        '<thead><tr><th style="text-align:left">Round</th><th>🔴 Red</th><th>⚪ White</th></tr></thead>' +
        '<tbody>' + rowsHtml +
        '<tr class="total"><td class="td-left">Total</td><td class="td-red" style="font-size:26px">' + totals.red + '</td><td style="font-size:26px;color:var(--st800)">' + totals.white + '</td></tr>' +
        '</tbody></table></div>') +
    winnerHtml +
    '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px">' +
      chunky('primary', 'lg', 'guess-again', '🔄 Play Again') +
      chunky('neutral', 'lg', 'home', '🏠 Home') +
    '</div>' +
  '</div>';
}
function renderGuess() {
  var g = S.guess;
  if (g.phase === 'setup') {
    var steps = [
      { emoji: '🤫', title: 'Heads down!', en: 'The asking team looks away and covers their eyes.', jp: '質問チームは頭を下げて待っててね！' },
      { emoji: '🎲', title: 'Secret person!', en: 'The OTHER team sees the secret person on the screen.', jp: 'もう一方のチームだけ、ひみつの人を見るよ！' },
      { emoji: '❓', title: 'Ask questions!', en: '"Can she swim?" — every question = +1 point. Tap cards to ✗ them out.', jp: '質問をしたら +1点。カードをタップして消そう！' },
      { emoji: '🎯', title: 'Guess the name!', en: 'Wrong guess = +1 point. Fewest points wins — like golf! ⛳', jp: 'なまえを当てたらラウンド終了！点が少ないほど勝ち！' }
    ];
    return '<div class="setup-col" style="max-width:64rem;margin:0 auto">' +
      '<div class="panel setup-title">' +
        '<h2>⛳ Team Golf Battle</h2>' +
        '<p class="sub">だれでしょう？ — 二つのチームで勝負！</p>' +
      '</div>' +
      '<div class="steps2">' +
        steps.map(function (s, i) {
          return '<div class="stepcard">' +
            '<span class="se" aria-hidden="true">' + s.emoji + '</span>' +
            '<div><p class="st1">' + (i + 1) + '. ' + esc(s.title) + '</p>' +
            '<p class="st2">' + esc(s.en) + '</p>' +
            '<p class="st3">' + esc(s.jp) + '</p></div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div class="panel askfirst">' +
        '<p>Who asks first? どっちのチームから？</p>' +
        '<div class="row">' +
          chunky('red', 'lg', 'guess-ask-red', '🔴 Red Team asks!') +
          chunky('neutral', 'lg', 'guess-ask-white', '⚪ White Team asks!') +
        '</div>' +
      '</div>' +
    '</div>';
  }
  if (g.phase === 'headsdown') {
    return '<div class="center-col" style="padding:32px 0">' +
      '<p class="hd-emoji pop" aria-hidden="true">🤫</p>' +
      '<h2 class="hd-title rise" style="animation-delay:.08s">HEADS DOWN!</h2>' +
      '<p class="hd-sub">' + TEAM_LABEL[g.asking] + ' — look away &amp; cover your eyes!</p>' +
      '<p class="hd-jp">' + TEAM_JP[g.asking] + 'のみなさん、下を向いて待っててね！</p>' +
      '<div class="btn-stack">' +
        chunky('primary', 'lg', 'guess-pick-mystery', '🎲 Pick the Secret Person!', ' style="font-size:24px"') +
        '<p class="teacher-note">Teacher: the other team will see it on the next screen.</p>' +
      '</div>' +
    '</div>';
  }
  if (g.phase === 'reveal' && g.mystery) {
    var other = g.asking === 'red' ? 'white' : 'red';
    return '<div class="center-col" style="padding:16px 0">' +
      '<p class="hd-sub">🤫 ' + TEAM_LABEL[other] + ' — this is the SECRET PERSON!</p>' +
      '<p class="hd-jp">' + TEAM_JP[other] + 'だけ見てね！アイコンをおぼえて、ヒミツをまもろう！</p>' +
      '<div class="pop">' + characterCard({ char: g.mystery, size: 'big', showLabels: true }) + '</div>' +
      chunky('green', 'lg', 'guess-heads-up', '🙋 Heads up! Time to ask!', ' style="font-size:24px"') +
    '</div>';
  }
  if (g.phase === 'result' && g.mystery) {
    var other2 = g.asking === 'red' ? 'white' : 'red';
    return '<div class="center-col" style="padding:16px 0">' +
      '<h2 class="hd-title green pop" style="font-size:44px">🎉 YES! It&#39;s ' + esc(g.mystery.name) + '!</h2>' +
      '<p class="hd-jp" style="font-size:20px">Read together! みんなで読もう！</p>' +
      characterCard({ char: g.mystery, size: 'big', showLabels: true }) +
      '<p class="result-pill">' + TEAM_LABEL[g.asking] + ' finished in ' + g.pts + ' point' + (g.pts === 1 ? '' : 's') + ' ⛳' +
        '<span class="small">fewer is better!</span></p>' +
      '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:8px">' +
        chunky('primary', 'lg', 'guess-next-round', '▶ Next Round — ' + TEAM_LABEL[other2] + ' asks') +
        chunky('neutral', 'lg', 'guess-finish', '🏁 Final Score') +
      '</div>' +
    '</div>';
  }
  if (g.phase === 'final') {
    return renderFinal(g);
  }

  /* ---- play phase ---- */
  var totals = { red: 0, white: 0 };
  g.records.forEach(function (r) { totals[r.team] += r.points; });
  var boardCards = CHARACTERS.map(function (c) {
    return characterCard({
      char: c, onClick: true, act: 'guess-card',
      eliminated: g.eliminated.indexOf(c.id) !== -1,
      wrong: g.wrongIds.indexOf(c.id) !== -1,
      flash: g.flashWrong === c.id
    });
  }).join('');
  var modals = '';
  if (g.guessOpen) modals += renderGuessModal(g);
  if (g.guideOpen) modals += renderIconGuide();
  var peekHtml = g.peek && g.mystery
    ? '<div class="peek"><div class="peekbox"><span class="peeklabel">🤫 SECRET</span>' +
      characterCard({ char: g.mystery }) + '</div></div>'
    : '';
  return '<div class="playwrap">' +
    '<div class="playbar">' +
      '<span class="pill p-white">Round ' + g.roundNum + '</span>' +
      teamPill(g.asking, true) +
      '<span class="pill p-amber">This round: ' + g.pts + ' pt' + (g.pts === 1 ? '' : 's') + '</span>' +
      '<span class="pill p-totals pill-totals">⛳ 🔴 ' + totals.red + ' · ⚪ ' + totals.white +
        '<span class="fewest">fewest wins</span></span>' +
      '<span class="right">' +
        chunky('neutral', 'sm', 'open-guide', '📚 Icons') +
        '<button type="button" class="peekbtn" data-act="peek-down" aria-label="Hold to peek at the secret person (teacher only)" oncontextmenu="return false">👁 Peek</button>' +
        chunky('ghost', 'sm', 'guess-finish', '🏁 Finish') +
      '</span>' +
    '</div>' +
    '<div style="display:flex;justify-content:center">' +
      '<div class="pill p-soft" style="padding:4px 16px">' + questionStarters() + '</div>' +
    '</div>' +
    '<div class="board pad-bottom">' + boardCards + '</div>' +
    '<div class="actionbar">' +
      chunky('primary', 'lg', 'guess-add-q', '❓ +1 Question <span class="ptsbubble">' + g.pts + '</span>', ' style="font-size:20px"') +
      chunky('neutral', 'lg', 'guess-undo', '↩️ Undo', g.log.length === 0 ? ' disabled' : '') +
      chunky('purple', 'lg', 'open-guess', '🎯 Guess a Name!', ' style="font-size:20px"') +
      '<span class="keys-hint">keys: Q / G / U</span>' +
    '</div>' +
    peekHtml + modals +
  '</div>';
}

/* ============================ RENDER ROOT =========================== */

var MODE_TITLES = {
  home: { en: 'Who Is It?', jp: 'だれでしょう？' },
  heshe: { en: 'He or She?', jp: 'どっちかな？' },
  guess: { en: 'Guess Who! — Golf Battle', jp: 'だれでしょう？' }
};
function render() {
  var t = MODE_TITLES[S.mode];
  $('#modeTitle').innerHTML = esc(t.en) + ' <span class="jp">' + esc(t.jp) + '</span>';
  $('#homeBtn').hidden = S.mode === 'home';
  var html = '';
  if (S.mode === 'home') html = renderHome();
  else if (S.mode === 'heshe') html = S.heshe ? renderHeshe() : '<div class="loading"><div class="spinner" aria-label="Loading"></div></div>';
  else if (S.mode === 'guess') html = S.guess ? renderGuess() : '';
  $('#app').innerHTML = html;
  $('#soundBtn').innerHTML = S.soundOn ? SPK_ON : SPK_OFF;
}
function go(mode) {
  S.mode = mode;
  render();
  window.scrollTo(0, 0);
}

/* ============================ ACTIONS =============================== */

function otherTeam(t) { return t === 'red' ? 'white' : 'red'; }
function guessTotals(g) {
  var totals = { red: 0, white: 0 };
  g.records.forEach(function (r) { totals[r.team] += r.points; });
  return totals;
}

function startRound(team, num) {
  var g = S.guess;
  g.asking = team; g.roundNum = num; g.mystery = null; g.eliminated = [];
  g.wrongIds = []; g.pts = 0; g.log = []; g.guessOpen = false; g.peek = false;
  g.phase = 'headsdown';
}
function pickMystery() {
  var g = S.guess;
  var pool = CHARACTERS.filter(function (c) { return g.used.indexOf(c.id) === -1; });
  if (pool.length === 0) { pool = CHARACTERS.slice(); g.used = []; }
  var pick = pool[Math.floor(Math.random() * pool.length)];
  g.used.push(pick.id);
  g.mystery = pick;
  sfx.horn();
  g.phase = 'reveal';
}
function resolveGuess(c) {
  var g = S.guess;
  if (!g.mystery) return;
  if (c.id === g.mystery.id) {
    g.records.push({ round: g.roundNum, team: g.asking, points: g.pts });
    sfx.fanfare();
    celebrate(true);
    g.guessOpen = false;
    g.phase = 'result';
    render();
  } else {
    sfx.wrong();
    g.pts += 1;
    g.log.push({ type: 'wrong', id: c.id });
    if (g.eliminated.indexOf(c.id) === -1) g.eliminated.push(c.id);
    if (g.wrongIds.indexOf(c.id) === -1) g.wrongIds.push(c.id);
    g.flashWrong = c.id;
    render();
    setTimeout(function () {
      if (S.mode === 'guess' && S.guess.flashWrong === c.id) {
        S.guess.flashWrong = null;
        render();
      }
    }, 700);
  }
}

function heshePick(p) {
  var h = S.heshe;
  var round = h.deck[h.idx];
  if (!round || h.solved || h.finished) return;
  var answer = round.char.gender === 'boy' ? 'He' : 'She';
  if (p === answer) {
    sfx.correct();
    celebrate(false);
    if (h.wrong.length === 0) h.stars += 1;
    h.solved = true;
  } else {
    sfx.wrong();
    if (h.wrong.indexOf(p) === -1) h.wrong.push(p);
  }
  render();
}
function hesheNext() {
  var h = S.heshe;
  if (h.idx < h.deck.length - 1) {
    sfx.click();
    h.idx += 1; h.wrong = []; h.solved = false;
  } else {
    sfx.finish();
    celebrate(true);
    h.finished = true;
  }
  render();
}

/* ========================== EVENT WIRING ============================ */

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  /* backdrop guard: clicking the dimmed area (not the modal) closes */
  if ((act === 'backdrop-guess' || act === 'backdrop-guide') && e.target.closest('.modal')) return;
  var g, id;
  switch (act) {
    case 'home': sfx.click(); go('home'); break;
    case 'start-heshe': sfx.click(); S.heshe = newHeshe(); go('heshe'); break;
    case 'start-guess': sfx.click(); S.guess = newGuess(); go('guess'); break;
    case 'sound': S.soundOn = !S.soundOn; if (S.soundOn) sfx.correct(); render(); break;
    case 'fs': toggleFs(); break;
    /* he / she */
    case 'heshe-answer': heshePick(el.getAttribute('data-p')); break;
    case 'heshe-next': hesheNext(); break;
    case 'heshe-listen': sfx.click(); S.heshe.listening = !S.heshe.listening; render(); break;
    case 'heshe-again': sfx.click(); S.heshe = newHeshe(); render(); break;
    /* guess who */
    case 'guess-ask-red': sfx.click(); S.guess = S.guess || newGuess(); startRound('red', 1); render(); break;
    case 'guess-ask-white': sfx.click(); S.guess = S.guess || newGuess(); startRound('white', 1); render(); break;
    case 'guess-pick-mystery': pickMystery(); render(); break;
    case 'guess-heads-up': sfx.click(); S.guess.phase = 'play'; render(); break;
    case 'guess-card':
      sfx.click();
      g = S.guess; id = el.getAttribute('data-id');
      var ix = g.eliminated.indexOf(id);
      if (ix === -1) g.eliminated.push(id); else g.eliminated.splice(ix, 1);
      render();
      break;
    case 'guess-add-q':
      sfx.coin(); g = S.guess; g.pts += 1; g.log.push({ type: 'q' }); render();
      break;
    case 'guess-undo':
      g = S.guess;
      if (g.log.length === 0) break;
      var last = g.log.pop();
      g.pts = Math.max(0, g.pts - 1);
      if (last.type === 'wrong' && last.id) {
        g.eliminated = g.eliminated.filter(function (x) { return x !== last.id; });
        g.wrongIds = g.wrongIds.filter(function (x) { return x !== last.id; });
      }
      sfx.click(); render();
      break;
    case 'open-guess': sfx.click(); S.guess.guessOpen = true; render(); break;
    case 'close-guess': case 'backdrop-guess': S.guess.guessOpen = false; render(); break;
    case 'guess-pick-name':
      id = el.getAttribute('data-id');
      resolveGuess(CHARACTERS.find(function (c) { return c.id === id; }));
      break;
    case 'open-guide': sfx.click(); S.guess.guideOpen = true; render(); break;
    case 'close-guide': case 'backdrop-guide': S.guess.guideOpen = false; render(); break;
    case 'guess-finish': sfx.finish(); S.guess.phase = 'final'; render(); break;
    case 'guess-next-round': startRound(otherTeam(S.guess.asking), S.guess.roundNum + 1); render(); window.scrollTo(0, 0); break;
    case 'guess-again':
      S.guess.records = []; S.guess.used = [];
      startRound('red', 1); S.guess.phase = 'setup'; render(); window.scrollTo(0, 0);
      break;
  }
});

/* peek (hold) */
document.addEventListener('pointerdown', function (e) {
  var el = e.target.closest('[data-act="peek-down"]');
  if (!el) return;
  e.preventDefault();
  S.guess.peek = true;
  render();
});
['pointerup', 'pointercancel'].forEach(function (ev) {
  document.addEventListener(ev, function () {
    if (S.mode === 'guess' && S.guess && S.guess.peek) {
      S.guess.peek = false;
      render();
    }
  });
});

/* fullscreen */
function toggleFs() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (e) { /* non critical */ }
}
document.addEventListener('fullscreenchange', function () {
  var btn = $('#fsBtn');
  if (btn) btn.classList.toggle('active', Boolean(document.fullscreenElement));
});

/* keyboard shortcuts */
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  var target = e.target;
  if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;
  if (S.mode === 'heshe' && S.heshe && !S.heshe.finished) {
    var h = S.heshe;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); heshePick('He'); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); heshePick('She'); }
    else if ((e.key === ' ' || e.key === 'Enter') && h.solved) { e.preventDefault(); hesheNext(); }
  } else if (S.mode === 'guess' && S.guess && S.guess.phase === 'play') {
    var g = S.guess;
    if (e.key === 'q' || e.key === 'Q') { sfx.coin(); g.pts += 1; g.log.push({ type: 'q' }); render(); }
    else if (e.key === 'g' || e.key === 'G') { sfx.click(); g.guessOpen = true; render(); }
    else if (e.key === 'u' || e.key === 'U') {
      if (g.log.length === 0) return;
      var last = g.log.pop();
      g.pts = Math.max(0, g.pts - 1);
      if (last.type === 'wrong' && last.id) {
        g.eliminated = g.eliminated.filter(function (x) { return x !== last.id; });
        g.wrongIds = g.wrongIds.filter(function (x) { return x !== last.id; });
      }
      sfx.click(); render();
    }
  } else if (e.key === 'Escape') {
    if (S.mode === 'guess' && S.guess && (S.guess.guessOpen || S.guess.guideOpen)) {
      S.guess.guessOpen = false; S.guess.guideOpen = false; render();
    }
  }
});

window.addEventListener('resize', function () { if (fxRunning) fxCtx(); });

/* =============================== BOOT =============================== */

render();
})();
</script>
</body>
