<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The Price Is Right — Here We Go! 5</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💴</text></svg>">

<!-- =====================================================================
  THE PRICE IS RIGHT — GAME SHOW EDITION
  Here We Go! 5  |  "How much is it?" / "It's ___ yen."
  Vanilla HTML / CSS / JS. No installs, no internet needed. Just open the file.

  KEYS:  Space / Enter = next action (start timer, reveal, ...)
         Left / Right  = previous / next slide
         W = group picker wheel (spin to choose a random group)
         M = mute   F = fullscreen
         1-6 / 0   = (on the title slide) pick a THEME / Random Mix

  TO EDIT ITEMS AND PRICES: change the ITEMS list at the top of the <script>.
  TO CHANGE WHICH ITEMS A THEME USES: edit the THEMES list right below it.
  TO USE YOUR OWN PHOTOS:   put the image file next to this HTML and write
                            img: 'photo.jpg' on that item's line.
====================================================================== -->

<style>
/* ===================== THEME ===================== */
:root{
  --bg:#1c0740; --bg2:#3e1c78; --card:#33165f; --card2:#2a1152;
  --gold:#ffc400; --pink:#ff3d7f; --teal:#2ec4b6; --orange:#ff8a3d;
  --white:#fff; --ink:#241047;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;height:100%;color:var(--white);overflow:hidden;
  font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",system-ui,Arial,sans-serif}
body{background:linear-gradient(135deg,#1c0740,#3e1c78,#1c0740);
  background-size:200% 200%;animation:bgshift 16s ease-in-out infinite alternate}
@keyframes bgshift{from{background-position:0% 0%}to{background-position:100% 100%}}

/* stage lights: two sweeping beams */
.beam{position:fixed;top:-70vh;left:50%;width:36vw;height:230vh;z-index:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,.08),transparent 55%);transform-origin:top center}
.b1{animation:sweepL 11s ease-in-out infinite alternate}
.b2{animation:sweepR 14s ease-in-out infinite alternate}
@keyframes sweepL{from{transform:translateX(-50%) rotate(-16deg)}to{transform:translateX(-50%) rotate(26deg)}}
@keyframes sweepR{from{transform:translateX(-50%) rotate(22deg)}to{transform:translateX(-50%) rotate(-24deg)}}

/* marquee bulb strips */
.bulbs{position:fixed;left:0;right:0;height:22px;z-index:6;pointer-events:none;
  background-image:radial-gradient(circle at 11px 11px,var(--gold) 4px,rgba(255,196,0,.25) 5px,transparent 6px);
  background-size:28px 22px;animation:bulbs 1s steps(2) infinite}
.bulbs.top{top:0}.bulbs.bottom{bottom:0}
@keyframes bulbs{0%{filter:brightness(1.25)}50%{filter:brightness(.5)}}

/* floating emoji bubbles rising in the background */
.fem{position:fixed;bottom:-16vh;z-index:0;pointer-events:none;opacity:.14;user-select:none;
  animation:femup linear infinite}
@keyframes femup{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-150vh) rotate(360deg)}}

/* progress bar */
#prog{position:fixed;top:0;left:0;height:5px;width:0;z-index:8;
  background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .35s;border-radius:0 3px 3px 0}

/* danger vignette when the timer is low */
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;
  box-shadow:inset 0 0 16vw rgba(255,61,127,.45)}
body.danger #vig{opacity:1;animation:vigblink 1s infinite}
@keyframes vigblink{0%,100%{opacity:.55}50%{opacity:1}}

/* ===================== STAGE ===================== */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:5vh 5vw 10vh;text-align:center;gap:2.6vh;z-index:2}
#stage.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}
  60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

h1,h2{margin:0;color:var(--gold);font-weight:900;letter-spacing:.02em}
h2{font-size:clamp(1.9rem,4.6vw,3.4rem);align-self:flex-start;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{font-size:clamp(1.1rem,2.4vw,1.8rem);margin:0}
.press{font-size:clamp(1.2rem,2.6vw,2rem);font-weight:900;color:var(--white);
  background:var(--pink);border-radius:2rem;padding:.45em 1.4em;animation:pressPulse 1.2s ease-in-out infinite}
@keyframes pressPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,61,127,.55)}
  50%{transform:scale(1.06);box-shadow:0 0 0 1.2em rgba(255,61,127,0)}}

/* title letters */
.mega{font-size:clamp(3rem,min(10.5vw,14vh),8rem);line-height:1.02}
.tl{display:inline-block;animation:tlIn .55s cubic-bezier(.3,1.6,.5,1) both,wave 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i)*.055s),calc(1s + var(--i)*.09s);text-shadow:0 .06em 0 rgba(0,0,0,.3)}
@keyframes tlIn{from{transform:translateY(-90vh) scale(.5);opacity:0}70%{transform:translateY(0) scale(1.15)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.14em)}}

/* reveal system: .hid = invisible but keeps its space */
.hid{opacity:0;transform:scale(.6)}
.rev{transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s both}
.stagger>*{animation:pop .5s both;animation-delay:calc(var(--d,0)*.14s)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.pulse{animation:pulse .4s}
.bouncy{display:inline-block;animation:pop .6s both,wiggle 2.6s ease-in-out .7s infinite;
  animation-delay:calc(var(--d,0)*.12s),calc(.8s + var(--d,0)*.12s)}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* ===================== GOAL: SPEECH BUBBLES ===================== */
.phrase{width:min(90vw,58rem);padding:2.6vh 2vw;border-radius:1.6rem;
  font-size:clamp(1.9rem,5.6vw,3.9rem);font-weight:900;position:relative}
.phrase.q{background:var(--teal);color:var(--ink)}
.phrase.q::after{content:'';position:absolute;bottom:-1.4rem;left:14%;
  border:1.2rem solid transparent;border-top-color:var(--teal)}
.phrase.a{background:var(--pink);color:var(--white)}
.phrase.a::after{content:'';position:absolute;top:-1.4rem;right:14%;
  border:1.2rem solid transparent;border-bottom-color:var(--pink)}
.bub-note{font-size:clamp(1.1rem,2.4vw,1.7rem);color:var(--gold)}

/* ===================== NUMBER DRILLS ===================== */
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vw;width:min(92vw,72rem)}
.num{background:var(--card);border:3px solid transparent;border-radius:1.1rem;padding:3.2vh 0;
  font-size:clamp(1.9rem,5.4vw,4rem);font-weight:900;cursor:pointer;user-select:none;
  transition:transform .15s,border-color .15s}
.num:hover{transform:translateY(-4px);border-color:var(--gold)}
.flash-btn{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:2rem;
  background:var(--gold);color:var(--ink);padding:.5em 1.3em;font-size:clamp(1.1rem,2.4vw,1.7rem);
  box-shadow:0 5px 0 #c79400;transition:transform .12s}
.flash-btn:hover{transform:translateY(-2px)}
.flash-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c79400}
.cue-line{font-size:clamp(1.15rem,2.5vw,1.9rem)}
.cue-line b{color:var(--gold)}

/* flash overlay */
#flashOv{position:fixed;inset:0;z-index:25;background:rgba(16,3,38,.93);
  display:grid;place-items:center;cursor:pointer}
#flashCard{background:linear-gradient(160deg,#3e1c78,#2a1152);border:5px solid var(--gold);
  border-radius:2rem;padding:5vh 6vw;text-align:center;
  box-shadow:0 0 6vw rgba(255,196,0,.35);animation:pop .35s both}
#flashLbl{font-size:clamp(1.4rem,3.2vw,2.4rem);font-weight:900;color:var(--gold)}
#flashNum{font-size:clamp(6rem,22vw,17rem);font-weight:900;line-height:1.1;color:var(--white);
  text-shadow:0 .04em 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.flash-hint{font-size:clamp(.95rem,2vw,1.3rem);opacity:.75}

/* ===================== FLIP CARDS (drills 3 & 4) ===================== */
.flipcard{perspective:1100px;cursor:pointer;animation:pop .5s both;animation-delay:calc(var(--d,0)*.12s)}
.flipin{position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.3,.4,1)}
.flipcard.open .flipin{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--white);color:var(--ink);border-radius:1.3rem;padding:2vh 1.4vw;
  width:clamp(9.5rem,19vw,15rem);display:flex;flex-direction:column;align-items:center;gap:.9vh;
  box-shadow:0 8px 22px rgba(0,0,0,.35)}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);background:#fff8e0}
.face .emoji{font-size:clamp(3rem,7.5vw,5.5rem);line-height:1.15}
.face .item-name{font-weight:800;font-size:clamp(1rem,1.7vw,1.35rem)}
.face .tag{background:#c9c4d6;color:var(--ink);border-radius:.7rem;padding:.35em 1em;
  font-weight:900;font-size:clamp(1.1rem,2vw,1.6rem);white-space:nowrap}
.face.back .tag{background:var(--pink);color:var(--white)}
.tag.winpop{animation:winpop .55s both}
@keyframes winpop{0%{transform:scale(.4) rotate(-8deg)}60%{transform:scale(1.2) rotate(3deg)}100%{transform:scale(1) rotate(0)}}

/* A / B partner bubbles */
.bubbles{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
.bub{border-radius:1.4rem;padding:1.6vh 2vw;font-size:clamp(1.3rem,3vw,2.3rem);font-weight:900;position:relative}
.bub.q{background:var(--teal);color:var(--ink)}
.bub.q::after{content:'';position:absolute;bottom:-1.1rem;left:12%;
  border:.9rem solid transparent;border-top-color:var(--teal)}
.bub.a{background:var(--pink);color:var(--white)}
.bub.a::after{content:'';position:absolute;bottom:-1.1rem;right:12%;
  border:.9rem solid transparent;border-top-color:var(--pink)}
.swap-chip{background:var(--gold);color:var(--ink);border-radius:2rem;padding:.4em 1.2em;
  font-weight:900;font-size:clamp(1.05rem,2.2vw,1.6rem);animation:pressPulse 1.6s ease-in-out infinite}

/* ===================== RULES / ROLES ===================== */
.rules{display:flex;flex-direction:column;gap:2.2vh;width:min(90vw,58rem);text-align:left}
.rule{display:flex;align-items:center;gap:1.5vw;font-size:clamp(1.25rem,2.8vw,2.1rem);font-weight:700}
.rule .txt{background:var(--card);border-radius:1rem;padding:1.4vh 1.4vw;flex:1}
.badge{flex:none;width:clamp(2.6rem,5vw,3.6rem);height:clamp(2.6rem,5vw,3.6rem);border-radius:50%;
  background:var(--gold);color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:1.3em}

/* ===================== ITEM PICTURES ===================== */
/* real image with the emoji hidden underneath as a fallback */
.pic{display:inline-grid;place-items:center;width:var(--picsz);height:var(--picsz);position:relative}
.pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:.7rem}
.pic>.fb{grid-area:1/1;font-size:calc(var(--picsz)*.92)!important;line-height:1!important;opacity:0;pointer-events:none}
.pic.fail>img{display:none}
.pic.fail>.fb{opacity:1}

/* ===================== GAME ROUNDS ===================== */
.round-top{display:flex;align-items:center;gap:1.5vw;align-self:flex-start;flex-wrap:wrap}
.round-label{font-size:clamp(1.9rem,4.6vw,3.4rem);font-weight:900;color:var(--gold)}
.special-badge{background:var(--pink);border-radius:2rem;padding:.35em 1em;
  font-weight:900;font-size:clamp(1.1rem,2.3vw,1.7rem);animation:pressPulse 1.4s infinite}
.round-body{display:flex;gap:3.5vw;align-items:center;justify-content:center;flex-wrap:wrap}
.item-card{background:var(--white);color:var(--ink);border-radius:1.5rem;
  box-shadow:0 10px 30px rgba(0,0,0,.4);padding:2.4vh 1.6vw;
  display:flex;flex-direction:column;align-items:center;gap:1vh}
.item-card.big{width:clamp(14rem,33vw,25rem);border:6px solid var(--gold)}
.item-card.big .emoji{font-size:clamp(5rem,14vw,9.5rem);line-height:1.2}
.item-card.big .item-name{font-weight:900;font-size:clamp(1.5rem,3vw,2.3rem)}
.item-card.big.wide{width:clamp(16rem,50vw,40rem)}
.swing{animation:swingIn .8s cubic-bezier(.3,1.4,.4,1) both}
@keyframes swingIn{0%{transform:translateX(-60vw) rotate(-14deg);opacity:0}
  70%{transform:translateX(2vw) rotate(3deg);opacity:1}100%{transform:translateX(0) rotate(0)}}
.round-side{display:flex;flex-direction:column;align-items:center;gap:2vh;min-width:min(88vw,27rem)}
.question{font-size:clamp(1.9rem,4.4vw,3.2rem);font-weight:900;color:var(--white)}
.chips{display:flex;gap:1vw;flex-wrap:wrap;justify-content:center}
.chip{background:var(--white);color:var(--ink);border-radius:1rem;padding:.35em .9em;
  font-weight:900;font-size:clamp(1.2rem,2.6vw,2rem);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.chip b{color:var(--pink);margin-right:.3em}
.hint-range{display:inline-flex;align-items:center;gap:.7vw;background:var(--card);
  border:3px dashed var(--gold);border-radius:1.2rem;padding:.35em 1em;
  font-weight:900;font-size:clamp(1.3rem,3vw,2.2rem)}
.hint-range .hr-label{color:var(--gold);font-size:.72em;letter-spacing:.05em}
.hint-range .hr-dash{color:var(--pink);font-size:.9em}
.fin-row{display:flex;gap:.8vw;align-items:center;justify-content:center;flex-wrap:wrap}
.fin-row .plus{color:var(--pink);font-size:clamp(1.6rem,4vw,3rem);font-weight:900}
.timer{display:flex;align-items:center;gap:1.4vw;width:100%}
.timer-bar{flex:1;height:2.1rem;background:var(--card);border-radius:1.1rem;overflow:hidden;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.4)}
.timer-fill{height:100%;width:100%;background:var(--teal);border-radius:1.1rem;
  transition:width .1s linear,background .3s}
.timer-fill.low{background:var(--pink)}
.timer-num{font-size:clamp(2rem,4.2vw,3.2rem);font-weight:900;min-width:2.2ch;color:var(--gold);
  font-variant-numeric:tabular-nums}
.timer-num.bump{animation:pulse .3s}
.hint{font-size:clamp(1.1rem,2.2vw,1.6rem);color:var(--gold);font-weight:700;min-height:1.3em}
.reveal-zone{display:grid;place-items:center;min-height:clamp(6rem,14vh,9rem);width:100%}
.reveal-zone>*{grid-area:1/1}
.show-me{font-size:clamp(2.4rem,6vw,4.6rem);font-weight:900;color:var(--gold);
  text-shadow:0 .05em 0 rgba(0,0,0,.3)}
.show-me:not(.hid){animation:pressPulse .8s ease-in-out infinite}
.price-tag{position:relative;background:linear-gradient(160deg,#ff6b9d,var(--pink));
  border-radius:1.1rem;padding:.12em .5em .12em 1.1em;
  font-size:clamp(2.8rem,7.5vw,5.8rem);font-weight:900;transform:rotate(-2deg);
  box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 3vw rgba(255,61,127,.4)}
.price-tag::before{content:'';position:absolute;top:.32em;left:.3em;width:.42em;height:.42em;
  border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.price-tag.drop{animation:tagdrop .95s cubic-bezier(.35,.8,.4,1) both}
@keyframes tagdrop{0%{transform:translateY(-130vh) rotate(-10deg);opacity:0}
  62%{transform:translateY(0) rotate(3deg);opacity:1}78%{transform:translateY(-7vh) rotate(-2deg)}
  100%{transform:translateY(0) rotate(-2deg)}}
.yen-mark{color:#fff;opacity:.9;margin-right:.08em}
.sentence{font-size:clamp(1.5rem,3.2vw,2.5rem);color:var(--gold);font-weight:800;min-height:1.4em}
.sentence .w{display:inline-block;animation:pop .45s both;animation-delay:calc(var(--d,0)*.2s)}

/* compact layout for short screens */
@media (max-height:640px){
  .round-body{flex-wrap:nowrap}
  .item-card.big{padding:1.2vh 1.2vw}
  .item-card.big.wide{width:38vw}
  .question{font-size:clamp(1.5rem,3vw,2.2rem);white-space:nowrap}
  .reveal-zone{min-height:clamp(4.5rem,9vh,6.5rem)}
  .price-tag{font-size:clamp(2.4rem,6vw,4.6rem)}
  .round-label{font-size:clamp(1.5rem,3.4vw,2.6rem)}
}

/* ===================== THEME CHIPS (title slide) ===================== */
.themes{display:flex;gap:.6vw;flex-wrap:wrap;justify-content:center;max-width:min(94vw,72rem)}
.tchip{font:inherit;font-weight:800;cursor:pointer;border:3px solid transparent;border-radius:2rem;
  background:var(--card);color:var(--white);padding:.28em .85em;
  font-size:clamp(.85rem,min(1.6vw,2.6vh),1.2rem);transition:transform .12s,border-color .12s}
.tchip b{color:var(--gold);margin-right:.2em}
.tchip:hover{border-color:var(--gold);transform:translateY(-2px)}
.tchip.on{background:var(--gold);color:var(--ink);border-color:#fff}
.tchip.on b{color:var(--pink)}

/* ===================== SHOPPING DRILL (menu board) ===================== */
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4vw;width:min(92vw,66rem)}
.mcard{background:var(--white);color:var(--ink);border-radius:1.2rem;padding:.9vh .9vw;
  display:flex;align-items:center;gap:.9vw;text-align:left;box-shadow:0 6px 16px rgba(0,0,0,.35);
  animation:pop .5s backwards;animation-delay:calc(var(--d,0)*.1s);transition:transform .2s,opacity .25s,box-shadow .2s}
.mtxt{display:flex;flex-direction:column;gap:.4vh;min-width:0}
.mname{font-weight:800;font-size:clamp(.95rem,min(1.7vw,2.8vh),1.35rem);line-height:1.15}
.mtag{align-self:flex-start;background:var(--pink);color:var(--white);border-radius:.6rem;
  padding:.05em .6em;font-weight:900;font-size:clamp(1.1rem,min(2vw,3.2vh),1.6rem);white-space:nowrap}
.menu.has-pick .mcard:not(.pick){opacity:.4}
.mcard.pick{transform:scale(1.07);z-index:2;
  box-shadow:0 0 0 .3rem var(--gold),0 0 3vw rgba(255,196,0,.65)}
.shop-btns{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center}
.flash-btn.alt{background:var(--teal);box-shadow:0 5px 0 #1f8f85}
.flash-btn.alt:active{box-shadow:0 1px 0 #1f8f85}

/* ===================== CLOSING ===================== */
.trophy{font-size:clamp(5rem,15vw,10rem);line-height:1;animation:tagdrop 1s cubic-bezier(.35,.8,.4,1) both}
.winners-line{font-size:clamp(2rem,5.5vw,4rem);font-weight:900;color:var(--white);margin:0}

/* ===================== NAV ===================== */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;
  padding:1.2vh 1.5vw;opacity:.5;transition:opacity .25s;z-index:10}
#nav:hover{opacity:1}
#nav button,#wheelOv button{font:inherit;font-weight:700;cursor:pointer;border:0;
  border-radius:.6rem;background:var(--card);color:var(--white);padding:.5em 1em;transition:transform .12s}
#nav button:hover,#wheelOv button:hover{background:var(--pink);transform:translateY(-2px)}
#cue{font-size:.95rem;color:var(--gold)}
#count{font-size:.9rem}

/* ===================== WHEEL OVERLAY ===================== */
#wheelOv{position:fixed;inset:0;z-index:40;background:rgba(10,2,26,.85);backdrop-filter:blur(5px);
  display:grid;place-items:center}
#wheelBox{background:linear-gradient(165deg,#3e1c78,#241047);border:5px solid var(--gold);
  border-radius:2rem;padding:3vh 4vw;text-align:center;box-shadow:0 0 8vw rgba(0,0,0,.6);
  max-width:94vw;max-height:94vh;overflow:auto}
#wheelWrap{position:relative;width:min(62vmin,420px);margin:2vh auto 0}
#wheelPtr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;
  border:15px solid transparent;border-top:26px solid var(--gold);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
#wheelCv{width:100%;height:auto;display:block}
#wheelRes{min-height:2.6em;font-size:clamp(1.6rem,4vw,2.8rem);font-weight:900;color:var(--gold)}
#wheelRes.show{animation:pop .5s both}
.wheel-btns{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
#wheelSpin{background:var(--pink)!important;font-weight:900!important;font-size:1.2rem!important;padding:.6em 1.6em!important}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bulbs top"></div>
<div class="bulbs bottom"></div>
<div class="beam b1"></div>
<div class="beam b2"></div>
<div id="bgemojis"></div>
<div id="prog"></div>

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const fmt = n => Number(n).toLocaleString('en-US');

/* ---- item pictures: real image if available, emoji as fallback ---- */
function imgSrc(it) {
  const v = it && it.img;
  if (!v) return null;
  if (typeof IMG !== 'undefined' && IMG[v]) return IMG[v];              // IMAGE BANK key
  if (/^(data:|https?:|blob:)/.test(v) || /[\\/.]/.test(v)) return v;   // URL or local file
  return null;
}
function picHTML(it, sz) {
  const src = imgSrc(it);
  if (!src) return `<span class="emoji" style="font-size:${sz}">${it.emoji || ''}</span>`;
  return `<span class="pic" style="--picsz:${sz}"><img src="${src}" alt="${it.name}" loading="lazy"`
    + ` onerror="this.parentElement.classList.add('fail')"><span class="emoji fb" aria-hidden="true">${it.emoji || ''}</span></span>`;
}

/* ---- sound (WebAudio, no files needed) ---- */
let ac = null, muted = false;
function ensureAC() {
  if (muted) return null;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tone(freq, dur = .12, type = 'sine', vol = .15, when = 0) {
  const a = ensureAC(); if (!a) return;
  try {
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function sweep(f0, f1, dur, vol = .1, type = 'triangle') {
  const a = ensureAC(); if (!a) return;
  try {
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function applause(dur = 1.6) {
  const a = ensureAC(); if (!a) return;
  try {
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const env = Math.pow(1 - t, 1.2) * (.55 + .45 * Math.sin(t * 70 + Math.sin(t * 29) * 4));
      d[i] = (Math.random() * 2 - 1) * env;
    }
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = .7;
    const g = a.createGain(); g.gain.value = .5;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  } catch (e) {}
}
const sfx = {
  pop:   () => tone(660, .1),
  tick:  () => tone(1000, .05, 'square', .06),
  tick2: () => tone(1600, .03, 'square', .07),
  ding:  () => { tone(880, .15); tone(1320, .3, 'sine', .12, .1); },
  buzz:  () => tone(150, .5, 'sawtooth', .15),
  whoosh:() => sweep(650, 120, .45, .09),
  drum:  () => { for (let k = 0; k < 14; k++) tone(110 + k * 7, .07, 'triangle', .13, k * .075); },
  win:   () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .25, 'triangle', .15, k * .14)),
  fanfare:() => [392, 392, 392, 523, 659, 784].forEach((f, k) => tone(f, .3, 'square', .1, k * .16)),
};

/* ---- confetti (canvas, optional origin + sideways push) ---- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = 0;
function fit() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', fit); fit();
function confetti(n = 140, ox = .5, oy = .45, push = 0) {
  const colors = ['#ffc400', '#ff3d7f', '#2ec4b6', '#ffffff', '#8b5cf6', '#ff8a3d'];
  for (let k = 0; k < n; k++) parts.push({
    x: innerWidth * ox, y: innerHeight * oy,
    vx: push + (Math.random() - .5) * 16, vy: -(Math.random() * 15 + 5),
    s: 6 + Math.random() * 8, c: colors[k % colors.length], r: Math.random() * 6
  });
  if (!raf) raf = requestAnimationFrame(stepConfetti);
}
function stepConfetti() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.r += .2;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); cx.restore(); });
  parts = parts.filter(p => p.y < innerHeight + 40);
  raf = parts.length ? requestAnimationFrame(stepConfetti) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}

/* ---- odometer count-up ---- */
function countUp(el, to, ms, done) {
  const t0 = performance.now();
  (function f(t) {
    const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(p < 1 ? Math.round(to * e) : to);
    p < 1 ? requestAnimationFrame(f) : done && done();
  })(t0);
}

const shuffle = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};

/* ---- background rising emoji bubbles (emoji follow the chosen theme) ---- */
function makeBubbles(set) {
  const box = $('#bgemojis'); box.innerHTML = '';
  for (let k = 0; k < 12; k++) {
    const s = document.createElement('span');
    s.className = 'fem'; s.textContent = set[k % set.length];
    s.style.left = (3 + Math.random() * 94) + 'vw';
    s.style.fontSize = (4 + Math.random() * 7) + 'vw';
    s.style.animationDuration = (10 + Math.random() * 12) + 's';
    s.style.animationDelay = -(Math.random() * 20) + 's';
    box.appendChild(s);
  }
}

/* ===================== STATE ===================== */
const STORE = 'pir-hwg5-v3';
const THEME_KEYS = Object.keys(THEMES);
let state = { i: 0, theme: CONFIG.theme, mix: null };
try {
  const s = JSON.parse(localStorage.getItem(STORE));
  if (s && typeof s.i === 'number') state.i = s.i;
  if (s && typeof s.theme === 'string') state.theme = s.theme;
  if (s && s.mix && Array.isArray(s.mix.rounds)) state.mix = s.mix;
} catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

/* ===================== THEMES: turn ids into items ===================== */
const toItems = ids => (ids || []).map(id => ITEMS[id]).filter(Boolean);

/* Random Mix: one round item from each price band (cheap → expensive), plus
   random warm-up / menu / final items drawn from every theme. */
function newMix() {
  const roundPool = [...new Set(THEME_KEYS.flatMap(k => THEMES[k].rounds))].filter(id => ITEMS[id]);
  const bands = [[0, 350], [350, 800], [800, 2500], [2500, 7000], [7000, 1e9]];
  const rounds = bands.map(([lo, hi]) => {
    const pool = roundPool.filter(id => ITEMS[id].price >= lo && ITEMS[id].price < hi);
    return shuffle(pool.length ? pool : roundPool)[0];
  });
  const cheap = [...new Set(THEME_KEYS.flatMap(k => [...THEMES[k].warm, ...THEMES[k].extra]))]
    .filter(id => ITEMS[id] && ITEMS[id].price <= 1000 && !rounds.includes(id));
  const mixed = shuffle(cheap);
  const finalPool = [...rounds.filter(id => ITEMS[id].price <= 1500), ...mixed.slice(6, 12)];
  return { warm: mixed.slice(0, 4), extra: mixed.slice(4, 6), rounds, final: shuffle(finalPool).slice(0, 3) };
}

function resolveTheme(key) {
  if (key === 'mix') {
    const m = state.mix || (state.mix = newMix());
    return { key, icon: '🎲', name: 'Random Mix',
      drill: toItems(m.warm), menu: toItems([...m.warm, ...m.extra]), rounds: toItems(m.rounds), final: toItems(m.final) };
  }
  const t = THEMES[key] || THEMES[THEME_KEYS[0]];
  return { key: THEMES[key] ? key : THEME_KEYS[0], icon: t.icon, name: t.name,
    drill: toItems(t.warm), menu: toItems([...t.warm, ...t.extra]), rounds: toItems(t.rounds), final: toItems(t.final) };
}

/* ===================== SLIDE LIST ===================== */
let ACTIVE = null, steps = [];
function applyTheme(key, reroll) {
  if (key === 'mix' && reroll) state.mix = newMix();
  ACTIVE = resolveTheme(key);
  state.theme = ACTIVE.key;
  steps = [
    { id: 'title' }, { id: 'goal' },
    { id: 'drill-10s' }, { id: 'drill-100s' }, { id: 'drill-1000s' },
    { id: 'drill-listen' }, { id: 'drill-pairs' }, { id: 'drill-shop' },
    { id: 'rules' }, { id: 'choral' },
    ...ACTIVE.rounds.map((item, n) => ({ id: 'round', n, items: [item] })),
    { id: 'final', label: 'Final Showdown', items: ACTIVE.final },
    { id: 'closing' },
  ];
  makeBubbles(['💴', ...new Set([...ACTIVE.drill, ...ACTIVE.rounds].map(it => it.emoji))]);
}
applyTheme(state.theme);
if (state.i >= steps.length) state.i = steps.length - 1;

/* pick a theme from the title slide (number keys or clicking a chip) */
let quietTitle = false;
function setTheme(key) {
  applyTheme(key, true);
  state.i = 0; save(); quietTitle = true; render();

/* the current slide registers an "action" (Space) and a "cleanup" here */

const setCue = t => { $('#cue').textContent = t || ''; };
const setProg = () => { $('#prog').style.width = ((state.i + 1) / steps.length * 100) + '%'; };

/* reveal the next hidden element inside the stage; returns false when none are left */
function revealNext(sel) {
  const el = stage.querySelector(sel + '.hid');
  if (!el) return false;
  el.classList.remove('hid'); sfx.pop(); return true;
}

/* ---- shared rapid-flash overlay ---- */
const flashOv = $('#flashOv'), flashNum = $('#flashNum'), flashLbl = $('#flashLbl');
let flashIv = null;
function startFlash(nums) {
  flashOv.classList.remove('hidden');
  flashLbl.textContent = 'What number?!';
  flashNum.textContent = fmt(nums[Math.floor(Math.random() * nums.length)]);
  sfx.tick();
  flashIv = setInterval(() => {
    flashNum.textContent = fmt(nums[Math.floor(Math.random() * nums.length)]);
    sfx.tick();
  }, 620);
}
function stopFlash() { clearInterval(flashIv); flashIv = null; flashLbl.textContent = 'Read this number! 👉'; sfx.ding(); }
function hideFlash() { flashOv.classList.add('hidden'); }
flashOv.addEventListener('click', () => {
  if (flashIv) stopFlash(); else { hideFlash(); if (cur.flashReset) cur.flashReset(); }
});

/* ===================== RENDERERS ===================== */
function render() {
  if (cur.cleanup) cur.cleanup();
  cur = { action: null, cleanup: null, flashReset: null };
  document.body.classList.remove('danger');
  const step = steps[state.i];
  stage.innerHTML = '';
  setCue('');
  setProg();
  const kind = step.id;

  if (kind === 'title') {
    const line1 = 'THE PRICE', line2 = 'IS RIGHT!';
    let i = 0;
    const letters = s => [...s].map(ch => ch === ' ' ? ' ' :
      `<span class="tl" style="--i:${i++};color:${['var(--gold)', 'var(--white)', 'var(--pink)'][i % 3]}">${ch}</span>`).join('');
    const deco = [...ACTIVE.drill.slice(0, 3), ...ACTIVE.rounds.slice(0, 3)];
    const emojis = deco.map(it => picHTML(it, 'clamp(2.4rem,min(7vw,11vh),4.8rem)'))
      .map((h, k) => `<span class="bouncy" style="--d:${k}">${h}</span>`).join('');
    const chips = [...THEME_KEYS.map((k, n) => ({ k, n: n + 1, icon: THEMES[k].icon, name: THEMES[k].name })),
                   { k: 'mix', n: 0, icon: '🎲', name: 'Random Mix' }]
      .map(c => `<button class="tchip ${state.theme === c.k ? 'on' : ''}" data-k="${c.k}"><b>${c.n}</b> ${c.icon} ${c.name}</button>`).join('');
    stage.innerHTML = `<h1 class="mega" aria-label="The Price Is Right">${letters(line1)}<br>${letters(line2)}</h1>
      <div class="emoji-row stagger" style="font-size:clamp(2.4rem,7vw,5rem);display:flex;gap:2vw">${emojis}</div>
      <p class="sub">Here We Go! 5 &nbsp;·&nbsp; How much is it?</p>
      <div class="themes" role="group" aria-label="Choose a theme">${chips}</div>
      <p class="press">▶ Press SPACE to start!</p>`;
    stage.querySelectorAll('.tchip').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.k)));
    setCue(`Press 1–${THEME_KEYS.length} to pick a theme · 0 = Random Mix`);
    if (!quietTitle) sfx.fanfare(); else sfx.pop();
    quietTitle = false;
  }

  else if (kind === 'goal') {
    stage.innerHTML = `<h2>Today's Goal</h2>
      <div class="phrase q pop">🙋 How much is it?</div>
      <div class="phrase a rev hid" id="ans">It's ___ yen!</div>
      <p class="bub-note rev hid" id="yen">yen = 円 &nbsp;💰 &nbsp;Say the price in English!</p>`;
    cur.action = () => revealNext('#ans') || revealNext('#yen');
    setCue('Space: show the answer');
  }

  else if (kind.startsWith('drill-1')) {
    renderNumDrill(kind);
  }

  else if (kind === 'drill-listen' || kind === 'drill-pairs') {
    renderFlipDrill(kind);
  }

  else if (kind === 'drill-shop') {
    renderShop();
  }

  else if (kind === 'rules') {
    const rules = [['👥', 'Groups of 4: talk and decide together'],
                   ['🤔', 'Write your guess on the whiteboard'],
                   ['🙌', '"Show me!": hold up your board together'],
                   ['🗣️', 'EVERYONE says together: "It\'s ___ yen."']];
    stage.innerHTML = `<h2>How to Play</h2>
      <div class="rules">${rules.map((r, k) =>
        `<div class="rule rev hid"><div class="badge">${k + 1}</div><div class="txt">${r[0]}&nbsp; ${r[1]}</div></div>`).join('')}</div>
      <p class="cue-line">🎯 Closest <b>without going over</b> wins!</p>`;
    cur.action = () => revealNext('.rule');
    setCue('Space: next rule');
  }

  else if (kind === 'choral') {
    stage.innerHTML = `<h2>Speak Together!</h2>
      <div class="phrase q pop">🙋 How much is it?</div>
      <div class="phrase a rev hid" id="all">ALL TOGETHER: It's ___ yen!</div>
      <p class="bub-note rev hid" id="loud">📢 Loud and proud — EVERYONE says the whole sentence!</p>`;
    const all = $('#all');
    all.addEventListener('click', () => {
      all.classList.remove('pulse'); void all.offsetWidth; all.classList.add('pulse'); sfx.ding();
    });
    cur.action = () => revealNext('#all') || revealNext('#loud');
    setCue('Space: show the chant · click it to repeat!');
  }

  else if (kind === 'round' || kind === 'final') {
    renderRound(step);
  }

  else if (kind === 'closing') {
    renderClosing();
  }

  $('#count').textContent = `${state.i + 1} / ${steps.length}`;
}

/* ---- Drill 6: shopping role-play (menu board, random customer pick) ---- */
function renderShop() {
  const menu = ACTIVE.menu;
  const cards = menu.map((it, k) => `<div class="mcard" style="--d:${k}">
      ${picHTML(it, 'clamp(2.4rem,min(5vw,8vh),4rem)')}
      <div class="mtxt"><div class="mname">${it.name}</div><div class="mtag">¥${fmt(it.price)}</div></div>
    </div>`).join('');
  stage.innerHTML = `<h2>Drill 6: Let's Go Shopping! 🛒</h2>
    <div class="menu">${cards}</div>
    <div class="bubbles">
      <div class="bub q rev hid" id="sq">🙋 Customer: How much is it?</div>
      <div class="bub a rev hid" id="sa">🏪 Shopkeeper: It's ___ yen!</div>
    </div>
    <div class="shop-btns">
      <button class="flash-btn" id="shopPick">🎲 Customer picks!</button>
      <button class="flash-btn alt" id="shopHide">🙈 Hide prices</button>
    </div>
    <p class="cue-line">Pairs: <b>Customer</b> points &amp; asks · <b>Shopkeeper</b> answers · then swap!</p>`;

  const cardEls = [...stage.querySelectorAll('.mcard')];
  const tagEls = cardEls.map(c => c.querySelector('.mtag'));
  const menuEl = $('.menu'), sq = $('#sq'), sa = $('#sa');
  const shown = new Set();               // items whose price has been announced
  let order = [], done = 0, phase = 0, target = -1, hidePrices = false, anim = null, dead = false;
  // phase: 0 = ready for a customer · 'spin' = choosing · 1 = waiting for the shopkeeper's answer

  const refreshTags = () => tagEls.forEach((t, k) => {
    t.textContent = (hidePrices && !shown.has(k)) ? '¥???' : '¥' + fmt(menu[k].price);
  });
  const clearPick = () => cardEls.forEach(c => c.classList.remove('pick'));

  const pickNext = () => {
    if (!order.length) order = shuffle([...menu.keys()]);
    target = order.shift();
    phase = 'spin'; setCue('…');
    sq.classList.add('hid'); sa.classList.add('hid');
    sa.textContent = "🏪 Shopkeeper: It's ___ yen!";
    menuEl.classList.add('has-pick'); clearPick();
    let n = 0, last = -1;
    anim = setInterval(() => {
      n++;
      clearPick();
      let k = target;
      if (n < 9) { do { k = Math.floor(Math.random() * menu.length); } while (k === last && menu.length > 1); }
      last = k; cardEls[k].classList.add('pick'); sfx.tick2();
      if (n >= 9) {
        clearInterval(anim); anim = null;
        sq.classList.remove('hid'); sfx.ding(); phase = 1;
        setCue('Space: shopkeeper answers');
      }
    }, 110);
  };
  const answer = () => {
    sa.textContent = `🏪 Shopkeeper: It's ${fmt(menu[target].price)} yen!`;
    sa.classList.remove('hid'); sfx.pop();
    shown.add(target); refreshTags();
    tagEls[target].classList.remove('winpop'); void tagEls[target].offsetWidth; tagEls[target].classList.add('winpop');
    done++; phase = 0;
    setCue(done >= menu.length ? 'Space: next slide' : 'Space: next customer');
  };

  cur.action = () => {
    if (phase === 'spin') return true;
    if (phase === 1) { answer(); return true; }
    if (done >= menu.length) return false;      // everyone has been asked about → move on
    pickNext(); return true;
  };
  $('#shopPick').addEventListener('click', e => { e.target.blur(); if (phase === 0 || phase === 1) { if (phase === 1) answer(); pickNext(); } });
  $('#shopHide').addEventListener('click', e => {
    hidePrices = !hidePrices; e.target.textContent = hidePrices ? '👀 Show prices' : '🙈 Hide prices';
    refreshTags(); sfx.pop(); e.target.blur();
  });
  cur.cleanup = () => { dead = true; clearInterval(anim); };
  setCue('Space: customer picks an item');
}

/* ---- a guessing round (also used for the final showdown) ---- */
function renderRound(step) {
  const items = step.items, multi = items.length > 1;
  const total = items.reduce((s, it) => s + it.price, 0);
  const label = step.label || `Round ${step.n + 1}`;
  const T = CONFIG.timerSeconds;
  const special = !!items[0].hint;
  const hint = multi ? '★ Double points!' : 'Closest without going over!';
  const face = multi
    ? `<div class="fin-row">${items.map((it, k) =>
        (k ? '<span class="plus">+</span>' : '') +
        `<span class="bouncy" style="--d:${k}">${picHTML(it, 'clamp(3rem,8vw,7rem)')}</span>`).join('')}</div>`
    : `<div class="bouncy" style="--d:0">${picHTML(items[0], 'clamp(9rem,20vw,15rem)')}</div>
       <div class="item-name">${items[0].name}</div>`;
  const range = special ? items[0].hint : null;
  const chips = range
    ? `<div class="hint-range pop"><span class="hr-label">💡 HINT</span>
         <span class="hr-price">¥${fmt(range[0])}</span><span class="hr-dash">〜</span><span class="hr-price">¥${fmt(range[1])}</span></div>`
    : '';

  stage.innerHTML = `
    <div class="round-top">
      <div class="round-label">${label}</div>
      ${special ? '<div class="special-badge">★ BIG PRICE!</div>'
                : (multi ? '<div class="special-badge">★ DOUBLE POINTS</div>' : '')}
    </div>
    <div class="round-body">
      <div class="item-card big swing ${multi ? 'wide' : ''}">${face}</div>
      <div class="round-side">
        <div class="question">${multi ? 'How much are they all?' : 'How much is it?'}</div>
        ${chips}
        <div class="timer"><div class="timer-bar"><div class="timer-fill"></div></div><div class="timer-num" id="tnum">${T}</div></div>
        <div class="hint">${hint}</div>
        <div class="reveal-zone">
          <div class="show-me rev hid">🙌 SHOW ME!</div>
          <div class="price-tag hid" id="ptag"><span class="yen-mark">¥</span><span id="pn">0</span></div>
        </div>
        <div class="sentence" id="sent"></div>
      </div>
    </div>`;

  const fill = $('.timer-fill'), num = $('#tnum');
  const elShow = $('.show-me'), elTag = $('#ptag'), elPn = $('#pn'), elSent = $('#sent');
  let phase = 0, left = T, iv = null, dead = false, lastDisp = T;
  const cues = ['Space: start the timer', 'Space: "SHOW ME!"', 'Space: reveal the price', 'Space: next slide'];
  setCue(cues[0]);

  const setDanger = on => document.body.classList.toggle('danger', on);
  const shake = () => { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); };

  const showMe = () => {
    clearInterval(iv); iv = null; phase = 2; setDanger(false);
    elShow.classList.remove('hid'); sfx.buzz(); shake(); setCue(cues[2]);
  };
  const startTimer = () => {
    phase = 1; setCue(cues[1]); sfx.pop();
    iv = setInterval(() => {
      left -= .1;
      fill.style.width = Math.max(0, left / T * 100) + '%';
      fill.classList.toggle('low', left <= 5);
      const disp = Math.ceil(Math.max(0, left));
      if (disp !== lastDisp) {
        lastDisp = disp; num.textContent = disp;
        if (disp <= 5 && disp > 0) {
          num.classList.remove('bump'); void num.offsetWidth; num.classList.add('bump');
          sfx.tick(); setDanger(true);
        }
      }
      if (left <= 0) showMe();
    }, 100);
  };
  const reveal = () => {
    phase = 3; setCue(''); setDanger(false);
    elShow.classList.add('hid');
    sfx.drum();
    setTimeout(() => {
      if (dead) return;
      elTag.classList.remove('hid'); elTag.classList.add('drop'); sfx.whoosh();
      countUp(elPn, total, 1300, () => {
        if (dead) return;
        elTag.classList.remove('drop'); elTag.classList.add('winpop');
        sfx.ding(); confetti(special || multi ? 180 : 80);
        elSent.innerHTML = `It's ${fmt(total)} yen.`.split(' ').map((w, i) =>
          `<span class="w" style="--d:${i}">${w}</span>`).join(' ');
        setCue(cues[3]);
      });
    }, 950);
  };

  cur.action = () => {
    if (phase === 0) { startTimer(); return true; }
    if (phase === 1) { showMe(); return true; }
    if (phase === 2) { reveal(); return true; }
    return false;
  };
  cur.cleanup = () => { dead = true; clearInterval(iv); setDanger(false); };
}

/* ===================== GROUP PICKER WHEEL ===================== */
const wheelOv = $('#wheelOv'), wheelCv = $('#wheelCv'), wheelRes = $('#wheelRes');
let wheelOpen = false, wheelSpinning = false, wheelRot = -Math.PI / 2;
const WCOLORS = ['#ffc400', '#ff3d7f', '#2ec4b6', '#ff8a3d', '#8b5cf6', '#39d98a'];
function drawWheel(highlight = -1) {
  const n = CONFIG.groupCount, r = wheelCv.width / 2 - 10, c0 = wheelCv.width / 2;
  const ctx = wheelCv.getContext('2d'); ctx.clearRect(0, 0, wheelCv.width, wheelCv.height);
  for (let i = 0; i < n; i++) {
    const a0 = wheelRot + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n;
    ctx.beginPath(); ctx.moveTo(c0, c0); ctx.arc(c0, c0, r, a0, a1); ctx.closePath();
    ctx.fillStyle = i === highlight ? '#ffffff' : WCOLORS[i % WCOLORS.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.save(); ctx.translate(c0, c0); ctx.rotate(a0 + Math.PI / n);
    ctx.fillStyle = i === highlight ? '#c2185b' : '#241047';
    ctx.font = '900 ' + Math.round(r * .2) + 'px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('G' + (i + 1), r - 16, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(c0, c0, r * .16, 0, 7);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = '#ffc400'; ctx.lineWidth = 8; ctx.stroke();
}
function openWheel() {
  wheelOpen = true; wheelOv.classList.remove('hidden');
  wheelRes.textContent = 'Spin to pick a group!'; wheelRes.className = '';
  drawWheel();
}
function closeWheel() { if (wheelSpinning) return; wheelOpen = false; wheelOv.classList.add('hidden'); }
function spinWheel() {
  if (wheelSpinning) return;
  wheelSpinning = true; wheelRes.textContent = ''; wheelRes.className = '';
  const n = CONFIG.groupCount, w = 2 * Math.PI / n;
  const target = Math.floor(Math.random() * n);
  const jitter = (Math.random() - .5) * .7 * w;
  const paEnd = target * w + w / 2 + jitter;                       // pointer angle we want at the end
  const needed = ((3 * Math.PI / 2 - paEnd) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  let delta = needed - (wheelRot % (2 * Math.PI)); if (delta < 0) delta += 2 * Math.PI;
  delta += 6 * 2 * Math.PI;                                        // 6 full spins of drama
  const dur = 4300, t0 = performance.now(), start = wheelRot;
  let lastIdx = -1;
  (function f(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    wheelRot = start + delta * e;
    const pa = ((3 * Math.PI / 2 - wheelRot) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    const idx = Math.floor(pa / w) % n;
    if (idx !== lastIdx) { lastIdx = idx; sfx.tick2(); }
    drawWheel();
    if (p < 1) requestAnimationFrame(f);
    else {
      wheelSpinning = false; drawWheel(target);
      wheelRes.innerHTML = `🎉 GROUP ${target + 1}! 🎉`; wheelRes.className = 'show';
      sfx.fanfare(); confetti(110);
    }
  })(t0);
}
$('#wheelSpin').addEventListener('click', () => { spinWheel(); });
$('#wheelClose').addEventListener('click', closeWheel);

/* ===================== NAVIGATION ===================== */
function go(n) {
  state.i = Math.max(0, Math.min(steps.length - 1, n)); save(); render();
}
function primary() { if (!(cur.action && cur.action())) go(state.i + 1); }
$('#prev').addEventListener('click', e => { go(state.i - 1); e.target.blur(); });
$('#next').addEventListener('click', e => { go(state.i + 1); e.target.blur(); });

addEventListener('keydown', e => {
  const k = e.key;
  if ((k === ' ' || k === 'Enter') && e.target.tagName === 'BUTTON') return;
  if (wheelOpen) {
    if (k === ' ' || k === 'Enter') { e.preventDefault(); spinWheel(); }
    else if (k === 'Escape' || k === 'w' || k === 'W') closeWheel();
    return;
  }
  if (k === ' ' || k === 'Enter') { e.preventDefault(); primary(); }
  else if (steps[state.i].id === 'title' && /^[0-9]$/.test(k)) {
    // title slide: 1-6 = pick a theme, 0 = random mix
    if (k === '0') setTheme('mix'); else if (THEME_KEYS[+k - 1]) setTheme(THEME_KEYS[+k - 1]);
  }
  else if (k === 'ArrowRight' || k === 'PageDown') go(state.i + 1);
  else if (k === 'ArrowLeft' || k === 'PageUp') go(state.i - 1);
  else if (k === 'm' || k === 'M') {
    muted = !muted; setCue(muted ? '🔇 Sound off' : '🔊 Sound on');
    setTimeout(() => { if ($('#cue').textContent.startsWith('🔊') || $('#cue').textContent.startsWith('🔇')) setCue(''); }, 1300);
  }
  else if (k === 'w' || k === 'W') openWheel();
  else if (k === 'f' || k === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  }
});
